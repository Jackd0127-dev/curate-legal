<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curate — Help & Support</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dim: #8B6F35;
      --obsidian: #0A0A0B;
      --surface: #111113;
      --surface-2: #18181C;
      --text: #E8E4DC;
      --text-dim: #9A9590;
      --border: rgba(201, 168, 76, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--obsidian);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201, 168, 76, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 100% 100%, rgba(201, 168, 76, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      background: rgba(17, 17, 19, 0.72);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold-dim);
      padding: clamp(36px, 7vw, 72px);
      animation: fadeUp 0.8s ease both;
    }

    .app-label {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200;
      font-size: 11px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-label::before {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    h1 {
      font-weight: 300;
      font-size: clamp(40px, 8vw, 68px);
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }

    h1 em {
      color: var(--gold-light);
      font-style: italic;
    }

    p {
      color: var(--text-dim);
      font-size: clamp(18px, 3vw, 22px);
      line-height: 1.8;
      font-weight: 300;
      margin-bottom: 28px;
    }

    .contact-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 24px 28px;
      margin-top: 16px;
    }

    .contact-label {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 12px;
    }

    a {
      color: var(--gold);
      font-family: 'Josefin Sans', sans-serif;
      font-size: clamp(15px, 3vw, 18px);
      font-weight: 300;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-bottom: 1px solid rgba(201, 168, 76, 0.3);
      transition: color 0.2s ease, border-color 0.2s ease;
      word-break: break-word;
    }

    a:hover,
    a:focus {
      color: var(--gold-light);
      border-color: var(--gold);
      outline: none;
    }

    .ornament {
      color: var(--gold-dim);
      font-size: 18px;
      letter-spacing: 0.5em;
      opacity: 0.5;
      margin-top: 44px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 20px;
      }

      main {
        padding: 34px 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="app-label">Curate</div>
    <h1>Help <em>&amp; Support</em></h1>
    <p>For help and support, contact us by email.</p>

    <div class="contact-card">
      <div class="contact-label">Contact</div>
      <a href="mailto:myappsfuture@icloud.com">myappsfuture@icloud.com</a>
    </div>

    <div class="ornament">· · ·</div>
  </main>
</body>
</html>
